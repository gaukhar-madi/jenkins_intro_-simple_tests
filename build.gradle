plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

allure {
    report {
        version.set("2.32.0")
    }
    adapter {
        // Указываем, использовать ли аспекты для @Step (по умолчанию true)
        aspectjWeaver.set(true)
        // Автоматически добавлять фреймворк спикера (JUnit 5)
        frameworks {
            junit5 {
                adapterVersion.set("2.32.0")
            }
        }
    }
}

dependencies {

    testImplementation 'com.codeborne:selenide:7.7.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.withType(Test) {
    useJUnitPlatform()

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}